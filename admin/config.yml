# ================== 승인 후 아래 3곳만 채우면 됩니다 ==================
backend:
  name: github
  repo: YOUR_GITHUB_ID/YOUR_REPO        # ① GitHub 저장소 (예: dand-interior/site)
  branch: main
  base_url: https://YOUR-DOMAIN.com     # ② 사이트 주소 (Vercel 주소 또는 도메인)
  auth_endpoint: api/auth               # (그대로 두기) 로그인 처리 주소
  commit_messages:
    create: "내용 추가: {{collection}} / {{slug}}"
    update: "내용 수정: {{collection}} / {{slug}}"
    delete: "내용 삭제: {{collection}} / {{slug}}"
    uploadMedia: "사진 업로드: {{path}}"
    deleteMedia: "사진 삭제: {{path}}"
# =====================================================================
# local_backend: true   # 내 컴퓨터에서 연습해볼 때만 주석 해제 (README 참고)

locale: ko
publish_mode: simple
site_url: https://YOUR-DOMAIN.com
media_folder: assets/images
public_folder: assets/images

collections:
  - name: settings
    label: "① 기본 정보 (연락처·푸터)"
    files:
      - name: site
        label: "회사 기본 정보"
        file: content/site.json
        format: json
        fields:
          - { label: "회사 이름", name: brand, widget: string }
          - { label: "공개 홈페이지 주소 (배포 후 https://도메인 입력)", name: site_url, widget: string, required: false, hint: "공개 도메인이 정해지면 입력하세요. 저장 후 canonical 및 사이트맵이 자동 생성됩니다." }
          - { label: "회사 이름 아래 작은 글씨", name: brand_sub, widget: string }
          - { label: "전화번호", name: tel, widget: string, hint: "010-0000-0000 형식" }
          - { label: "이메일", name: mail, widget: string }
          - { label: "주소", name: addr, widget: string }
          - { label: "인스타그램 주소(URL)", name: insta, widget: string }
          - { label: "블로그 주소(URL)", name: blog, widget: string }
          - { label: "시공 지역", name: region, widget: string }
          - { label: "메타 픽셀 ID (숫자만, 인스타 광고 리타겟팅용)", name: meta_pixel_id, widget: string, required: false }
          - { label: "메타 도메인 인증 코드 (facebook-domain-verification 값)", name: meta_domain_verification, widget: string, required: false }
          - { label: "직통 번호 (문자 수신용, 비워도 됨)", name: tel_direct, widget: string, required: false }
          - { label: "직통 번호 표시 이름", name: tel_direct_label, widget: string, required: false }
          - { label: "사업자 상호", name: biz_name, widget: string, required: false }
          - { label: "대표자", name: biz_rep, widget: string, required: false }
          - { label: "사업자등록번호", name: biz_regno, widget: string, required: false }
          - { label: "네이버 서치어드바이저 소유확인 코드 (naver-site-verification 값)", name: naver_site_verification, widget: string, required: false }
          - { label: "유튜브 채널 주소(URL, 있을 때만)", name: youtube, widget: string, required: false }
          - label: "외부 후기 링크 (네이버 플레이스·블로그·구글 리뷰)"
            name: review_links
            widget: list
            required: false
            fields:
              - { label: "버튼 이름 (예: 네이버 리뷰 보기)", name: label, widget: string }
              - { label: "주소(URL)", name: url, widget: string }
          - { label: "핀터레스트 주소(URL, 있을 때만)", name: pinterest, widget: string, required: false }
          - { label: "검색 키워드 (쉼표로 구분)", name: seo_keywords, widget: string, required: false, hint: "예: 안산 인테리어, 상가 인테리어" }
          - { label: "검색 결과에 보이는 회사 소개문", name: site_desc, widget: text }
          - { label: "카톡·SNS 공유 시 대표 사진", name: og_image, widget: image }
          - { label: "푸터 회사명 뒤 문구", name: footer_line, widget: string }
          - { label: "푸터 하단 안내 문구", name: footer_note, widget: text }
          - { label: "떠 있는 버튼 1 (견적)", name: float_quote, widget: string }
          - { label: "떠 있는 버튼 2 (전화)", name: float_tel, widget: string }

  - name: pages
    label: "② 페이지별 문구·사진"
    files:
      - name: home
        label: "홈 화면"
        file: content/home.json
        format: json
        fields:
          - label: "맨 위 큰 화면"
            name: hero
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "큰 제목 (줄바꿈 가능)", name: title, widget: text }
              - { label: "설명 문장", name: text, widget: text }
              - { label: "버튼 1 글자", name: btn1, widget: string }
              - { label: "버튼 2 글자", name: btn2, widget: string }
              - { label: "오른쪽 카드 제목", name: note_title, widget: string }
              - { label: "오른쪽 카드 설명", name: note_text, widget: text }
              - { label: "배경 사진", name: img, widget: image }
              - { label: "배경 사진 설명(검색용)", name: img_alt, widget: string }
              - { label: "배경 사진 아래 안내 문구", name: img_note, widget: text }
          - label: "핵심 4칸 (사진 아래)"
            name: stats
            widget: list
            fields:
              - { label: "제목", name: t, widget: string }
              - { label: "설명", name: d, widget: string }
          - label: "시공 분야"
            name: services
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - label: "항목"
                name: items
                widget: list
                fields:
                  - { label: "이름", name: t, widget: string }
                  - { label: "설명", name: d, widget: text }
                  - label: "슬라이드 사진 (여러 장, 순서대로 넘어갑니다)"
                    name: images
                    widget: list
                    required: false
                    field: { label: "사진", name: img, widget: image }
                  - { label: "사진 아래 안내 문구 (AI 이미지면 꼭 표시)", name: img_note, widget: string, required: false }
          - label: "설계 소개 (도면 → 3D → 렌더링)"
            name: design
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - { label: "아래 안내 문구", name: note, widget: text }
              - { label: "링크 버튼 글자 (비우면 숨김)", name: link_text, widget: string, required: false }
              - { label: "링크 주소", name: link, widget: string, required: false }
              - label: "단계 (3~4단계 권장)"
                name: stages
                widget: list
                fields:
                  - { label: "번호", name: no, widget: string }
                  - { label: "탭 이름", name: tab, widget: string }
                  - { label: "제목", name: title, widget: string }
                  - { label: "설명", name: desc, widget: text }
                  - { label: "사진 (비우면 기본 예시 도면/3D 그림이 나옵니다. 실제 도면·렌더링을 올리면 교체됩니다)", name: img, widget: image, required: false }
                  - { label: "사진을 틀 안에 전부 보이게 (도면은 체크)", name: contain, widget: boolean, default: false, required: false }
                  - { label: "그림 아래 설명", name: caption, widget: string }
          - label: "시공 사례 소제목"
            name: cases
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
          - label: "공사 일정표"
            name: schedule
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - { label: "표 설명(검색·접근성용)", name: aria, widget: string }
              - label: "주차 이름"
                name: weeks
                widget: list
                field: { label: "이름", name: w, widget: string }
              - label: "공종 막대"
                name: rows
                widget: list
                hint: "시작·길이는 0~100 숫자(%). 3주 기준 1주=33"
                fields:
                  - { label: "공종 이름", name: label, widget: string }
                  - { label: "막대 안 글자", name: bar, widget: string }
                  - { label: "시작 위치(%)", name: start, widget: number, value_type: float, min: 0, max: 100 }
                  - { label: "길이(%)", name: width, widget: number, value_type: float, min: 1, max: 100 }
                  - { label: "진한 색으로 표시", name: dark, widget: boolean, default: false }
          - label: "고객 후기 구역 (후기가 있을 때만 화면에 나옵니다. 실제 고객 후기만 입력하세요)"
            name: testimonials
            widget: object
            collapsed: true
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - label: "후기 목록"
                name: items
                widget: list
                required: false
                summary: "{{fields.who}} · {{fields.project}}"
                fields:
                  - { label: "후기 내용(고객 인터뷰 인용구)", name: quote, widget: text }
                  - { label: "고객 (예: 안산 카페 사장님)", name: who, widget: string }
                  - { label: "프로젝트 이름", name: project, widget: string, required: false }
          - label: "사용 자재 구역 (자재가 있을 때만 화면에 나옵니다)"
            name: materials
            widget: object
            collapsed: true
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - label: "자재 목록"
                name: items
                widget: list
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { label: "자재 이름 (예: 친환경 E0 합판, 포셀린 타일)", name: name, widget: string }
                  - { label: "사양·특징", name: spec, widget: text, required: false }
                  - { label: "사진", name: img, widget: image, required: false }
          - label: "진행 절차"
            name: process
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - label: "한눈에 보는 진행 흐름 (위에 화살표로 나옵니다)"
                name: flow
                widget: list
                field: { label: "단계 이름", name: o, widget: string }
              - label: "단계 (번호는 자동)"
                name: steps
                widget: list
                fields:
                  - { label: "단계 이름", name: t, widget: string }
                  - { label: "설명", name: d, widget: string }
              - label: "공사 과정 4단계 (이게 있으면 위 흐름·단계 대신 이것이 나옵니다)"
                name: phases
                widget: list
                required: false
                fields:
                  - { label: "번호 (예: 01)", name: no, widget: string }
                  - { label: "영문 이름", name: en, widget: string }
                  - { label: "단계 이름", name: t, widget: string }
                  - label: "세부 항목"
                    name: items
                    widget: list
                    field: { label: "항목", name: o, widget: string }
          - label: "디자인 컨셉 소개 구역"
            name: concept
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - { label: "버튼 글자", name: btn, widget: string }
              - label: "홈에 보여줄 컨셉 (위에서부터 큰 카드 순서, 최대 5개)"
                name: featured
                widget: list
                max: 5
                field:
                  label: "컨셉"
                  name: slug
                  widget: relation
                  collection: works
                  file: concepts
                  search_fields: ["items.*.title"]
                  value_field: "items.*.slug"
                  display_fields: ["items.*.title"]
          - label: "상담 안내 배너"
            name: cta
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: text, widget: text }
              - { label: "버튼 글자", name: btn, widget: string }
          - label: "자주 묻는 질문"
            name: faq
            widget: list
            fields:
              - { label: "질문", name: q, widget: string }
              - { label: "답변", name: a, widget: text }

      - name: about
        label: "소개 페이지"
        file: content/about.json
        format: json
        fields:
          - { label: "브라우저 탭 제목", name: seo_title, widget: string }
          - { label: "검색 결과 설명", name: seo_desc, widget: text }
          - { label: "검색 키워드 (쉼표로 구분)", name: seo_keywords, widget: string, required: false, hint: "예: 안산 인테리어, 상가 인테리어" }
          - label: "맨 위 화면"
            name: hero
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: text }
              - { label: "설명", name: text, widget: text }
              - { label: "배경 사진", name: img, widget: image }
          - label: "일하는 방식"
            name: story
            widget: object
            fields:
              - { label: "사진", name: img, widget: image }
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: text }
              - { label: "본문", name: text, widget: text }
              - label: "핵심 3가지"
                name: points
                widget: list
                fields:
                  - { label: "제목", name: t, widget: string }
                  - { label: "설명", name: d, widget: text }
          - label: "약속 구역 (소개 페이지 가운데 검은 박스)"
            name: promise
            widget: object
            required: false
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "소개 문구", name: text, widget: text }
              - label: "약속 항목"
                name: items
                widget: list
                fields:
                  - { label: "제목", name: t, widget: string }
                  - { label: "설명", name: d, widget: string }
          - label: "연혁"
            name: history
            widget: object
            required: false
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - label: "연혁 항목"
                name: items
                widget: list
                fields:
                  - { label: "날짜 (예: 2023.03)", name: date, widget: string }
                  - { label: "내용", name: title, widget: string }
                  - { label: "추가 설명", name: desc, widget: string, required: false }
          - label: "업체 정보"
            name: business
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
              - label: "항목 (사업자번호·대표자 등 추가 가능)"
                name: items
                widget: list
                fields:
                  - { label: "항목명", name: k, widget: string }
                  - { label: "내용", name: v, widget: string }

      - name: portfolio
        label: "시공 사례 페이지"
        file: content/portfolio.json
        format: json
        fields:
          - { label: "브라우저 탭 제목", name: seo_title, widget: string }
          - { label: "검색 결과 설명", name: seo_desc, widget: text }
          - { label: "검색 키워드 (쉼표로 구분)", name: seo_keywords, widget: string, required: false, hint: "예: 안산 인테리어, 상가 인테리어" }
          - label: "맨 위 화면"
            name: hero
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: text }
              - { label: "설명", name: text, widget: text }
              - { label: "배경 사진", name: img, widget: image }
          - label: "프로젝트 필터 (스타일·규모는 해당 프로젝트가 있을 때만 화면에 나옵니다)"
            name: filters
            widget: object
            collapsed: true
            fields:
              - label: "공간별 이름"
                name: cat_names
                widget: object
                fields:
                  - { label: "주거", name: residential, widget: string }
                  - { label: "상업", name: commercial, widget: string }
                  - { label: "뷰티·스파·욕실", name: bath, widget: string }
                  - { label: "오피스", name: office, widget: string }
                  - { label: "쇼룸", name: showroom, widget: string }
              - label: "스타일 선택지"
                name: styles
                widget: list
                field: { label: "스타일", name: o, widget: string }
              - label: "규모 선택지"
                name: sizes
                widget: list
                field: { label: "규모", name: o, widget: string }
          - label: "시공 완료 사례 소제목"
            name: real
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }
          - label: "디자인 컨셉 소제목"
            name: concept
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
              - { label: "설명", name: desc, widget: text }

      - name: contact
        label: "견적 문의 페이지"
        file: content/contact.json
        format: json
        fields:
          - { label: "브라우저 탭 제목", name: seo_title, widget: string }
          - { label: "검색 결과 설명", name: seo_desc, widget: text }
          - { label: "검색 키워드 (쉼표로 구분)", name: seo_keywords, widget: string, required: false, hint: "예: 안산 인테리어, 상가 인테리어" }
          - label: "맨 위 화면"
            name: hero
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: text }
              - { label: "설명", name: text, widget: text }
              - { label: "배경 사진", name: img, widget: image }
          - label: "연락처 카드"
            name: direct
            widget: object
            fields:
              - { label: "작은 윗글씨", name: eyebrow, widget: string }
              - { label: "제목", name: title, widget: string }
