  - name: works
    label: "③ 시공 사례·컨셉 사진"
    files:
      - name: cases
        label: "실제 시공 사례 (추가·삭제·사진 교체)"
        file: content/cases.json
        format: json
        fields:
          - label: "시공 사례 목록"
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "지역(사진 없을 때 표시)", name: place, widget: string }
              - { label: "이름", name: title, widget: string }
              - { label: "설명", name: desc, widget: string }
              - { label: "현장 사진", name: img, widget: image, required: false }
              - { label: "꼬리표 글자", name: badge, widget: string }
              - { label: "버튼 글자", name: link_text, widget: string }
              - { label: "버튼 연결 주소 (비우고 아래 '상세 페이지 주소'를 쓰면 자동 연결)", name: link, widget: string, required: false }
              - { label: "상세 페이지 주소 이름 (영문 소문자·하이픈, 사진을 여러 장 넣을 때만)", name: slug, widget: string, required: false, pattern: ['^[a-z0-9-]*$', "영문 소문자, 숫자, 하이픈(-)만 가능"] }
              - { label: "상세 페이지 소개글", name: intro, widget: text, required: false }
              - label: "공간 분류 (필터용)"
                name: cat
                widget: select
                default: commercial
                options: [{ label: 주거, value: residential }, { label: 상업, value: commercial }, { label: "뷰티·스파·욕실", value: bath }, { label: 오피스, value: office }, { label: 쇼룸, value: showroom }]
              - { label: "스타일 (필터용: 모던·미니멀·모던 클래식·하이엔드 중 하나)", name: style_filter, widget: string, required: false }
              - { label: "규모 (필터용: 20평형대·30-40평형대·50평 이상·대형 상업공간 중 하나)", name: size_filter, widget: string, required: false }
              - { label: "검색 키워드 (쉼표로 구분)", name: seo_keywords, widget: string, required: false }
              - label: "시공 전·후 비교 (같은 위치에서 찍은 사진 쌍이 있을 때만 나옵니다)"
                name: before_after
                widget: list
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "시공 전 사진", name: before, widget: image }
                  - { label: "시공 후 사진", name: after, widget: image }
                  - { label: "설명", name: caption, widget: string, required: false }
              - label: "시공 영상·현장 VLOG 링크 (유튜브 등)"
                name: videos
                widget: list
                required: false
                fields:
                  - { label: "버튼 글자", name: label, widget: string }
                  - { label: "영상 주소(URL)", name: url, widget: string }
              - label: "블로그 시공 과정 글 링크"
                name: blog_posts
                widget: list
                required: false
                fields:
                  - { label: "버튼 글자", name: label, widget: string }
                  - { label: "글 주소(URL)", name: url, widget: string }
              - label: "고객 후기 (실제 후기만)"
                name: testimonial
                widget: object
                required: false
                fields:
                  - { label: "후기 내용", name: quote, widget: text, required: false }
                  - { label: "고객 (예: 안산 카페 사장님)", name: who, widget: string, required: false }
              - label: "상세 페이지 정보 (위치·용도 등)"
                name: facts
                widget: list
                required: false
                fields:
                  - { label: "항목", name: k, widget: string }
                  - { label: "내용", name: v, widget: string }
              - label: "상세 페이지 사진 (단계별로 묶여 표시됩니다)"
                name: gallery
                widget: list
                required: false
