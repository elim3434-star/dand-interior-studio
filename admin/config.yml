              - { label: "주소용 영문 이름 (영문 소문자·하이픈만, 예: new-cafe)", name: slug, widget: string, pattern: ['^[a-z0-9-]+$', "영문 소문자, 숫자, 하이픈(-)만 가능"] }
              - { label: "사진", name: img, widget: image }
